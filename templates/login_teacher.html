{% extends 'base.html' %}
{% block content %}
<div style="max-width: 440px; margin: 100px auto; padding: 0 20px;">
    <div class="glass-card" style="padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="font-size: 3rem; margin-bottom: 12px;">👨‍🏫</div>
            <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">Teacher Login</h2>
            <p style="opacity: 0.7; font-size: 0.9rem;">Please select your course code to log in.</p>
        </div>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2);">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label for="course_code" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; opacity: 0.9;">Choose Course Code</label>
                <select id="course_code" name="course_code" required
                        style="width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer;">
                    <option value="" disabled selected>Select Course Code</option>
                    {% for course in courses %}
                    <option value="{{ course.code }}">{{ course.code }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; font-size: 16px; padding: 14px; background: #10b981;">
                Access Dashboard
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13px; opacity: 0.6;">
            Are you a student? <a href="/student/login" style="color: #10b981; font-weight: 600; text-decoration: none;">Login here</a>
        </div>
    </div>
</div>

<style>
    select:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
</style>
{% endblock %}
