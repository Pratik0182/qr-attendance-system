{% extends 'base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 100px auto; padding: 0 20px;">
    <div class="glass-card" style="padding: 48px; text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 24px;">📬</div>
        <h2 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em;">Need Support?</h2>
        <p style="opacity: 0.7; font-size: 1.1rem; margin-bottom: 40px;">Our technical team at NIT Delhi is ready to assist you with any system issues.</p>
        
        <div style="display: flex; flex-direction: column; gap: 24px;">
            <a href="mailto:sams@nitdelhi.ac.in" style="text-decoration: none; color: inherit;">
                <div style="background: var(--table-header-bg); padding: 18px 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; transition: transform 0.2s;">
                    <span style="font-size: 1.2rem;">📧</span>
                    <span style="font-weight: 700; font-size: 15px;">sams@nitdelhi.ac.in</span>
                </div>
            </a>
            
            <div style="background: var(--table-header-bg); padding: 18px 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; transition: transform 0.2s;">
                <span style="font-size: 1.2rem;">🏙️</span>
                <span style="font-weight: 700; font-size: 15px;">National Institute of Technology Delhi</span>
            </div>
            
            <a href="/" class="btn-primary" style="margin-top: 16px; padding: 16px;">
                Return to Homepage
            </a>
        </div>
    </div>
</div>

<style>
    a div:hover {
        transform: translateY(-4px);
        background: var(--dropdown-hover);
    }
</style>
{% endblock %}
